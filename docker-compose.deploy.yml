# This file is for deploying only the API and frontend services
# It assumes that model training has already been completed
# and the necessary model files exist in the ./models directory

services:
  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    restart: always
    ports:
      - "9998:9998" # Expose FastAPI port
    volumes:
      - ./models:/app/models:ro # Read-only for model files
      - ./data:/app/data:ro # Read-only for data files
      - ./logs:/app/logs
    environment:
      - PORT=9998
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: always
    ports:
      - "80:80" # Expose the frontend on port 80
    depends_on:
      fastapi:
        condition: service_healthy
    environment:
      - REACT_APP_API_URL=http://localhost:9998
    networks:
      - app-network

networks:
  app-network:
    driver: bridge