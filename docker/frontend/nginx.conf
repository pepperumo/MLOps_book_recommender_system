server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI
    location /api/ {
        proxy_pass http://fastapi:9998/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Handle direct access to the API root
    location = /api {
        return 302 /api/;
    }
    
    # Proxy metrics to FastAPI metrics endpoint
    location /metrics {
        proxy_pass http://fastapi:9998/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Proxy health checks
    location /health {
        proxy_pass http://fastapi:9998/health;
        proxy_set_header Host $host;
    }
}