# This file is for running the complete data pipeline and model training

services:
  data-retrieval:
    build:
      context: .
      dockerfile: docker/data-retrieval/Dockerfile
    container_name: data-retrieval-container
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "test", "-f", "/app/data/raw/retrieval_complete"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - pipeline-network  
  data-processing:
    build:
      context: .
      dockerfile: docker/data-processing/Dockerfile
    container_name: data-processing-container
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      data-retrieval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/app/data/processing_complete"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - pipeline-network

  model-training:
    build:
      context: .
      dockerfile: docker/model-training/Dockerfile
    container_name: model-training-container
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=https://dagshub.com/pepperumo/MLOps_book_recommender_system.mlflow
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD}
      - DAGSHUB_USERNAME=${DAGSHUB_USERNAME}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    depends_on:
      data-processing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/app/models/training_complete"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    networks:
      - pipeline-network

networks:
  pipeline-network:
    driver: bridge
