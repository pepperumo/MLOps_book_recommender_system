name: API Tests

on:
  push:
    branches: [ main , master ]
  pull_request:
    branches: [ main , master ]
  # Optional: Run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test_api:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        # Install fastAPI specific requirements
        pip install -r docker/fastAPI/requirements.txt
        # Install the project package
        pip install -e .

    - name: Start API in background
      run: |
        # Start API with output redirected to log file
        python src/fastAPI/api.py > api_output.log 2>&1 &
        API_PID=$!
        echo "API started with PID: $API_PID"
        
        # Wait longer for API to initialize (30 seconds instead of 10)
        echo "Waiting 30 seconds for API to initialize..."
        sleep 30
        
        # Check if API process is still running
        if ps -p $API_PID > /dev/null; then
          echo "API process is running with PID: $API_PID"
        else
          echo "API process is not running! Check logs for errors"
          cat api_output.log
          exit 1
        fi
        
        # Display API logs
        echo "API startup logs:"
        cat api_output.log
        
        # Check if API is actually responding
        echo "Checking if API is responding..."
        curl -v http://localhost:8000/health || echo "API is not responding to health check"
        curl -v http://localhost:8000/ || echo "API is not responding to root endpoint"

    - name: Run API tests
      run: |
        pytest src/fastAPI/test_api_pytest.py -v
