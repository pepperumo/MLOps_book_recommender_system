name: API Tests

on:
  push:
    branches: [ main , master ]
  pull_request:
    branches: [ main , master ]
  # Optional: Run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test_api:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        # Install fastAPI specific requirements
        pip install -r docker/fastAPI/requirements.txt
        # Install the project package
        pip install -e .

    - name: Start API in background
      run: |
        python src/fastAPI/api.py &
        # Give the API time to start up
        sleep 10

    - name: Run API tests
      run: |
        pytest src/fastAPI/test_api_pytest.py -v