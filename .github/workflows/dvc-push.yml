name: DVC Push

on:
  push:
    branches: [ main, master ]
    paths:
      - 'models/**'
      - 'data/**'
      - 'dvc.yaml'
      - 'dvc.lock'
  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  dvc_push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history to allow proper git operations

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install DVC dependencies from the requirements file
        pip install -r docker/dvc/requirements.txt
        # Install the project package
        pip install -e .

    - name: Configure Git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Set up Git credentials for DVC operations
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # Configure Git with token for push operations if needed
        git remote set-url origin "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        
        echo "Git configured successfully"

    - name: Inspect and Configure DVC
      env:
        # Use repository secrets instead of environment secrets
        DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        # First, let's see what the current configuration looks like
        echo "Current DVC config:"
        cat .dvc/config
        
        # Create a minimal working config
        echo "Creating fresh DVC config for DAGsHub S3"
        cp .dvc/config .dvc/config.bak
        
        # Check if there's a config file; if not, create one
        if [ ! -f ".dvc/config" ]; then
          mkdir -p .dvc
          touch .dvc/config
        fi
        
        # Write a clean config with just the essential S3 settings
        cat > .dvc/config << EOF
        [core]
            remote = origin
        ['remote "origin"']
            url = s3://dvc
            endpointurl = https://dagshub.com/pepperumo/MLOps_book_recommender_system.s3
            access_key_id = ${DAGSHUB_USERNAME}
            secret_access_key = ${DAGSHUB_TOKEN}
        EOF
        
        echo "New DVC config created:"
        cat .dvc/config
        
        echo "DVC remote configured successfully"

    - name: Verify model artifacts
      run: |
        # Check if model artifacts exist
        if [ -f "models/collaborative.pkl" ] && [ -f "models/collaborative_config.json" ]; then
          echo "✅ Model artifacts detected"
        else
          echo "❌ Model artifacts might be missing, attempting to continue anyway"
        fi

    - name: Pull DVC artifacts
      run: |
        # Pull existing artifacts
        dvc pull || echo "DVC pull failed or not necessary, continuing..."

    - name: Commit DVC outputs
      run: |
        # Try to list available stages
        echo "Available DVC stages:"
        dvc stage list || echo "No stages found or error listing stages"
        
        # Commit train_model stage specifically (following Docker container logic)
        echo "🔄 Committing DVC outputs for stage 'train_model'..."
        dvc commit train_model -f || echo "No changes to commit for train_model stage"
        
        # Also commit any other stages that might have changes
        for stage in $(dvc stage list 2>/dev/null | grep -v "train_model" || echo ""); do
          if [ ! -z "$stage" ]; then
            dvc commit $stage -f || echo "No changes to commit for stage $stage"
          fi
        done

    - name: Track non-pipeline files
      run: |
        # Add any non-pipeline files from /models that are not already in dvc.yaml
        if [ -d "models" ]; then
          for file in $(find models -type f -not -path "*/\.*" | grep -v ".dvc" 2>/dev/null || echo ""); do
            if [ ! -z "$file" ]; then
              if ! grep -q "$file" dvc.yaml 2>/dev/null && ! grep -q "$(basename $file)" dvc.yaml 2>/dev/null; then
                echo "🔄 Adding non-pipeline file to DVC: $file"
                dvc add "$file" || echo "Could not add $file, it might be managed by a pipeline"
              else
                echo "ℹ️ Skipping $file as it's managed by the pipeline"
              fi
            fi
          done
        else
          echo "No models directory found"
        fi

    - name: Push DVC artifacts
      run: |
        # Push all tracked artifacts to DVC remote storage
        dvc push -v || echo "DVC push failed, check logs for details"
        
        echo "DVC push attempt completed"

    - name: Commit and push DVC metadata
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Add and commit DVC metadata changes
        git add .dvc/
        git add '*.dvc' || echo "No .dvc files to add"
        git add dvc.lock || echo "No dvc.lock to add"
        
        # Check if there are changes to commit
        if ! git diff --staged --quiet; then
          git commit -m "📅 Update DVC metadata [skip ci]"
          git push origin HEAD
          echo "DVC metadata committed and pushed successfully!"
        else
          echo "No DVC metadata changes to commit"
        fi