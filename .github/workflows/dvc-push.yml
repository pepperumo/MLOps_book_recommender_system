name: DVC Push

on:
  push:
    branches: [ main, master ]
    paths:
      - 'dvc.yaml'
      - 'dvc.lock'
      - '.dvc/config'
      - '*.dvc'
  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  dvc_push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history to allow proper git operations

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install DVC dependencies from the requirements file
        pip install -r docker/dvc/requirements.txt

    - name: Configure Git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Set up Git credentials
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        echo "Git configured successfully"

    - name: Debug DVC configuration
      run: |
        # Show DVC version and configuration
        dvc --version
        echo "DVC configuration:"
        cat .dvc/config || echo "No config file found"

    - name: Configure DVC with DAGsHub credentials
      env:
        DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        # Ensure DVC config directory exists
        mkdir -p .dvc
        
        # Create a local config file for credentials
        cat > .dvc/config.local << EOF
        ['remote "origin"']
            access_key_id = ${DAGSHUB_USERNAME}
            secret_access_key = ${DAGSHUB_TOKEN}
        EOF
        
        # Set proper permissions
        chmod 600 .dvc/config.local
        
        echo "DVC credentials configured in .dvc/config.local"

    - name: Pull from DVC remote
      run: |
        echo "Attempting to pull from DVC remote..."
        # Only pull DVC files that are tracked in the repository
        dvc pull -v || echo "DVC pull failed - this is expected if the files don't exist remotely yet"

    - name: Push to DVC remote
      run: |
        echo "Pushing DVC metadata to remote..."
        # Push any changes that have been committed to Git
        dvc push -v || echo "DVC push failed - this may happen if there are no tracked files to push"
        
        echo "DVC operations completed."